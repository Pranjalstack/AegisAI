<!-- frontend/index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aegis AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0f19;
            color: #f5f7fb;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 22px 32px;
            border-bottom: 1px solid #202638;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .shield {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #151c2d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .brand h1 {
            margin: 0;
            font-size: 22px;
        }

        .brand p {
            margin: 3px 0 0;
            color: #8d96aa;
            font-size: 13px;
        }

        .status {
            color: #69d391;
            font-size: 13px;
        }

        main {
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 55px 0;
            flex: 1;
        }

        .hero {
            text-align: center;
            margin-bottom: 45px;
        }

        .hero h2 {
            font-size: 40px;
            margin: 0 0 12px;
        }

        .hero p {
            margin: 0 auto;
            max-width: 620px;
            color: #9ba4b7;
            line-height: 1.6;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 35px;
        }

        .action-card {
            width: 100%;
            min-height: 180px;
            border: 1px solid #252d40;
            background: #111827;
            color: #f5f7fb;
            border-radius: 18px;
            padding: 24px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .action-card:hover {
            transform: translateY(-3px);
            border-color: #3d4b68;
        }

        .action-card:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .action-icon {
            font-size: 27px;
            margin-bottom: 16px;
        }

        .action-card h3 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .action-card p {
            margin: 0;
            color: #8992a5;
            font-size: 13px;
            line-height: 1.5;
        }

        .result {
            background: #111827;
            border: 1px solid #252d40;
            border-radius: 20px;
            padding: 28px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 22px;
        }

        .result-header h3 {
            margin: 0;
        }

        .risk {
            padding: 8px 14px;
            border-radius: 999px;
            background: #1b2233;
            color: #8d96aa;
            font-weight: bold;
            font-size: 13px;
        }

        .risk.high {
            background: #381b24;
            color: #ff7b91;
        }

        .risk.medium {
            background: #382f18;
            color: #e8c86a;
        }

        .risk.low {
            background: #173126;
            color: #69d391;
        }

        .risk.error {
            background: #381b24;
            color: #ff7b91;
        }

        .result-body {
            color: #98a1b4;
            line-height: 1.6;
            min-height: 120px;
        }

        .result-section {
            margin-top: 22px;
        }

        .result-section h4 {
            margin: 0 0 10px;
            color: #f5f7fb;
        }

        .result-section ul {
            margin: 0;
            padding-left: 20px;
        }

        .result-section li {
            margin-bottom: 7px;
        }

        .url {
            word-break: break-all;
        }

        .analysis-text {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        input[type="file"] {
            display: none;
        }

        .message-box {
            margin-top: 22px;
        }

        .message-box textarea {
            width: 100%;
            min-height: 180px;
            resize: vertical;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #30394e;
            background: #0b0f19;
            color: #f5f7fb;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
            outline: none;
        }

        .message-box textarea:focus {
            border-color: #596985;
        }

        .message-actions {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .message-button {
            min-height: 44px;
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid #30394e;
            background: #172033;
            color: #f5f7fb;
            cursor: pointer;
        }

        .message-button.primary {
            background: #27344d;
        }

        .message-button:hover {
            border-color: #596985;
        }

        .message-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 850px) {
            .actions {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 520px) {
            .actions {
                grid-template-columns: 1fr;
            }

            .hero h2 {
                font-size: 30px;
            }

            header {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>

        <div class="brand">

            <div class="shield">
                🛡️
            </div>

            <div>

                <h1>
                    Aegis AI
                </h1>

                <p>
                    On-device digital safety copilot
                </p>

            </div>

        </div>

        <div class="status">
            ● Local AI Ready
        </div>

    </header>


    <main>

        <section class="hero">

            <h2>
                Your Digital Safety Copilot
            </h2>

            <p>
                Analyze screens, documents, messages and audio
                for suspicious activity and understand why something
                may be risky.
            </p>

        </section>


        <section class="actions">

            <button
                type="button"
                class="action-card"
                id="scanScreenButton"
            >

                <div class="action-icon">
                    🖥️
                </div>

                <h3>
                    Scan Screen
                </h3>

                <p>
                    Analyze the current screen for suspicious
                    messages, websites and popups.
                </p>

            </button>


            <button
                type="button"
                class="action-card"
                id="scanFileButton"
            >

                <div class="action-icon">
                    📄
                </div>

                <h3>
                    Scan File
                </h3>

                <p>
                    Check PDFs and documents for suspicious
                    requests, links and scam indicators.
                </p>

            </button>


            <button
                type="button"
                class="action-card"
                id="scanMessageButton"
            >

                <div class="action-icon">
                    ✉️
                </div>

                <h3>
                    Scan Message
                </h3>

                <p>
                    Analyze an email or message for social
                    engineering and phishing patterns.
                </p>

            </button>


            <button
                type="button"
                class="action-card"
                id="scanAudioButton"
            >

                <div class="action-icon">
                    🎙️
                </div>

                <h3>
                    Scan Audio
                </h3>

                <p>
                    Transcribe audio locally and detect suspicious
                    requests or scam conversations.
                </p>

            </button>

        </section>


        <input
            type="file"
            id="fileInput"
            accept=".pdf,application/pdf"
        >


        <input
            type="file"
            id="audioInput"
            accept=".wav,.mp3,.m4a,.ogg,.webm,audio/*"
        >


        <section class="result">

            <div class="result-header">

                <h3>
                    Security Result
                </h3>

                <div
                    class="risk"
                    id="riskBadge"
                >
                    WAITING FOR SCAN
                </div>

            </div>

            <div
                class="result-body"
                id="resultBody"
            >
                Select a scan above to analyze something with Aegis AI.
            </div>

        </section>

    </main>

</div>


<script>

    const scanScreenButton =
        document.getElementById(
            "scanScreenButton"
        );

    const scanFileButton =
        document.getElementById(
            "scanFileButton"
        );

    const scanMessageButton =
        document.getElementById(
            "scanMessageButton"
        );

    const scanAudioButton =
        document.getElementById(
            "scanAudioButton"
        );

    const fileInput =
        document.getElementById(
            "fileInput"
        );

    const audioInput =
        document.getElementById(
            "audioInput"
        );

    const riskBadge =
        document.getElementById(
            "riskBadge"
        );

    const resultBody =
        document.getElementById(
            "resultBody"
        );


    function setScanning(message) {

        riskBadge.className =
            "risk";

        riskBadge.textContent =
            "SCANNING...";

        resultBody.innerHTML =
            "";

        const strong =
            document.createElement(
                "strong"
            );

        strong.textContent =
            "Aegis is analyzing.";

        const br =
            document.createElement(
                "br"
            );

        const text =
            document.createTextNode(
                "\n" + message
            );

        resultBody.appendChild(
            strong
        );

        resultBody.appendChild(
            br
        );

        resultBody.appendChild(
            text
        );
    }


    function showError(message) {

        riskBadge.className =
            "risk error";

        riskBadge.textContent =
            "ERROR";

        resultBody.innerHTML =
            "";

        const strong =
            document.createElement(
                "strong"
            );

        strong.textContent =
            "Unable to complete the scan.";

        const br =
            document.createElement(
                "br"
            );

        resultBody.appendChild(
            strong
        );

        resultBody.appendChild(
            br
        );

        resultBody.appendChild(
            document.createTextNode("\n")
        );

        resultBody.appendChild(
            document.createTextNode(
                message
            )
        );
    }


    function renderResult(
        data,
        typeLabel
    ) {

        if (data.error) {

            showError(
                data.message ||
                "The backend returned an error."
            );

            return;
        }

        const risk =
            String(
                data.risk || "LOW"
            ).toLowerCase();

        riskBadge.className =
            `risk ${risk}`;

        riskBadge.textContent =
            `${String(
                data.risk || "UNKNOWN"
            ).toUpperCase()} RISK`;

        resultBody.innerHTML =
            "";


        const scoreSection =
            document.createElement(
                "div"
            );

        scoreSection.className =
            "result-section";

        const scoreHeading =
            document.createElement(
                "h4"
            );

        scoreHeading.textContent =
            `${typeLabel} Result`;

        const scoreText =
            document.createElement(
                "div"
            );

        scoreText.textContent =
            `Risk Score: ${data.score}`;

        scoreSection.appendChild(
            scoreHeading
        );

        scoreSection.appendChild(
            scoreText
        );

        resultBody.appendChild(
            scoreSection
        );


        if (data.filename) {

            const fileSection =
                document.createElement(
                    "div"
                );

            fileSection.className =
                "result-section";

            const fileHeading =
                document.createElement(
                    "h4"
                );

            fileHeading.textContent =
                "File";

            const fileText =
                document.createElement(
                    "div"
                );

            fileText.textContent =
                data.filename;

            fileSection.appendChild(
                fileHeading
            );

            fileSection.appendChild(
                fileText
            );

            resultBody.appendChild(
                fileSection
            );
        }


        if (data.transcript) {

            const section =
                document.createElement(
                    "div"
                );

            section.className =
                "result-section";

            const heading =
                document.createElement(
                    "h4"
                );

            heading.textContent =
                "Transcript";

            const transcript =
                document.createElement(
                    "div"
                );

            transcript.className =
                "analysis-text";

            transcript.textContent =
                data.transcript;

            section.appendChild(
                heading
            );

            section.appendChild(
                transcript
            );

            resultBody.appendChild(
                section
            );
        }


        if (
            data.reasons &&
            data.reasons.length > 0
        ) {

            const section =
                document.createElement(
                    "div"
                );

            section.className =
                "result-section";

            const heading =
                document.createElement(
                    "h4"
                );

            heading.textContent =
                "Why it may be risky";

            const list =
                document.createElement(
                    "ul"
                );

            data.reasons.forEach(
                reason => {

                    const item =
                        document.createElement(
                            "li"
                        );

                    item.textContent =
                        reason;

                    list.appendChild(
                        item
                    );
                }
            );

            section.appendChild(
                heading
            );

            section.appendChild(
                list
            );

            resultBody.appendChild(
                section
            );
        }


        if (
            data.urls &&
            data.urls.length > 0
        ) {

            const section =
                document.createElement(
                    "div"
                );

            section.className =
                "result-section";

            const heading =
                document.createElement(
                    "h4"
                );

            heading.textContent =
                "Links detected";

            const list =
                document.createElement(
                    "ul"
                );

            data.urls.forEach(
                url => {

                    const item =
                        document.createElement(
                            "li"
                        );

                    item.className =
                        "url";

                    item.textContent =
                        url;

                    list.appendChild(
                        item
                    );
                }
            );

            section.appendChild(
                heading
            );

            section.appendChild(
                list
            );

            resultBody.appendChild(
                section
            );
        }


        if (data.explanation) {

            const section =
                document.createElement(
                    "div"
                );

            section.className =
                "result-section";

            const heading =
                document.createElement(
                    "h4"
                );

            heading.textContent =
                "AI Explanation";

            const explanation =
                document.createElement(
                    "div"
                );

            explanation.className =
                "analysis-text";

            explanation.textContent =
                data.explanation;

            section.appendChild(
                heading
            );

            section.appendChild(
                explanation
            );

            resultBody.appendChild(
                section
            );
        }


        if (data.vision) {

            const section =
                document.createElement(
                    "div"
                );

            section.className =
                "result-section";

            const heading =
                document.createElement(
                    "h4"
                );

            heading.textContent =
                "Visual Analysis";

            const vision =
                document.createElement(
                    "div"
                );

            vision.className =
                "analysis-text";

            vision.textContent =
                data.vision;

            section.appendChild(
                heading
            );

            section.appendChild(
                vision
            );

            resultBody.appendChild(
                section
            );
        }
    }


    scanScreenButton.addEventListener(
        "click",
        async () => {

            scanScreenButton.disabled =
                true;

            setScanning(
                "Switch to the screen you want Aegis to inspect during the capture countdown."
            );

            try {

                const response =
                    await fetch(
                        "http://127.0.0.1:8000/scan-screen",
                        {
                            method: "POST"
                        }
                    );

                const data =
                    await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "The screen scan failed."
                    );
                }

                renderResult(
                    data,
                    "Screen Scan"
                );

            } catch (error) {

                showError(
                    error.message
                );

            } finally {

                scanScreenButton.disabled =
                    false;
            }
        }
    );


    scanFileButton.addEventListener(
        "click",
        () => {

            fileInput.click();
        }
    );


    fileInput.addEventListener(
        "change",
        async () => {

            const file =
                fileInput.files[0];

            if (!file) {
                return;
            }

            if (
                !file.name
                    .toLowerCase()
                    .endsWith(".pdf")
            ) {

                showError(
                    "Please select a PDF file."
                );

                fileInput.value =
                    "";

                return;
            }

            scanFileButton.disabled =
                true;

            setScanning(
                `Analyzing ${file.name}...`
            );

            try {

                const encodedName =
                    encodeURIComponent(
                        file.name
                    );

                const response =
                    await fetch(
                        `http://127.0.0.1:8000/scan-file?filename=${encodedName}`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/pdf"
                            },
                            body: file
                        }
                    );

                const data =
                    await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "The file scan failed."
                    );
                }

                renderResult(
                    data,
                    "File Scan"
                );

            } catch (error) {

                showError(
                    error.message
                );

            } finally {

                scanFileButton.disabled =
                    false;

                fileInput.value =
                    "";
            }
        }
    );


    scanMessageButton.addEventListener(
        "click",
        () => {

            resultBody.innerHTML = `
                <div class="message-box">

                    <h4>
                        Paste a message or email
                    </h4>

                    <textarea
                        id="messageInput"
                        maxlength="12000"
                        placeholder="Paste the email or message you want Aegis to analyze..."
                    ></textarea>

                    <div class="message-actions">

                        <button
                            type="button"
                            class="message-button primary"
                            id="analyzeMessageButton"
                        >
                            Analyze Message
                        </button>

                        <button
                            type="button"
                            class="message-button"
                            id="cancelMessageButton"
                        >
                            Cancel
                        </button>

                    </div>

                </div>
            `;

            const analyzeButton =
                document.getElementById(
                    "analyzeMessageButton"
                );

            const cancelButton =
                document.getElementById(
                    "cancelMessageButton"
                );

            const messageInput =
                document.getElementById(
                    "messageInput"
                );


            analyzeButton.addEventListener(
                "click",
                async () => {

                    const message =
                        messageInput.value.trim();

                    if (!message) {

                        showError(
                            "Please enter a message to analyze."
                        );

                        return;
                    }

                    scanMessageButton.disabled =
                        true;

                    analyzeButton.disabled =
                        true;

                    cancelButton.disabled =
                        true;

                    setScanning(
                        "Analyzing the message for suspicious patterns."
                    );

                    try {

                        const response =
                            await fetch(
                                "http://127.0.0.1:8000/scan-message",
                                {
                                    method: "POST",
                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },
                                    body: JSON.stringify({
                                        message: message
                                    })
                                }
                            );

                        const data =
                            await response.json();

                        if (!response.ok) {

                            throw new Error(
                                data.message ||
                                "The message scan failed."
                            );
                        }

                        renderResult(
                            data,
                            "Message Scan"
                        );

                    } catch (error) {

                        showError(
                            error.message
                        );

                    } finally {

                        scanMessageButton.disabled =
                            false;
                    }
                }
            );


            cancelButton.addEventListener(
                "click",
                () => {

                    riskBadge.className =
                        "risk";

                    riskBadge.textContent =
                        "WAITING FOR SCAN";

                    resultBody.textContent =
                        "Select a scan above to analyze something with Aegis AI.";

                    scanMessageButton.disabled =
                        false;
                }
            );


            messageInput.focus();
        }
    );


    scanAudioButton.addEventListener(
        "click",
        () => {

            audioInput.click();
        }
    );


    audioInput.addEventListener(
        "change",
        async () => {

            const file =
                audioInput.files[0];

            if (!file) {
                return;
            }

            const allowedExtensions = [
                ".wav",
                ".mp3",
                ".m4a",
                ".ogg",
                ".webm"
            ];

            const fileName =
                file.name.toLowerCase();

            const isAllowed =
                allowedExtensions.some(
                    extension =>
                        fileName.endsWith(
                            extension
                        )
                );

            if (!isAllowed) {

                showError(
                    "Please select WAV, MP3, M4A, OGG, or WEBM audio."
                );

                audioInput.value =
                    "";

                return;
            }

            scanAudioButton.disabled =
                true;

            setScanning(
                `Analyzing ${file.name} with local speech recognition...`
            );

            try {

                const encodedName =
                    encodeURIComponent(
                        file.name
                    );

                const response =
                    await fetch(
                        `http://127.0.0.1:8000/scan-audio?filename=${encodedName}`,
                        {
                            method: "POST",
                            body: file
                        }
                    );

                const data =
                    await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "The audio scan failed."
                    );
                }

                renderResult(
                    data,
                    "Audio Scan"
                );

            } catch (error) {

                showError(
                    error.message
                );

            } finally {

                scanAudioButton.disabled =
                    false;

                audioInput.value =
                    "";
            }
        }
    );

</script>

</body>
</html>
